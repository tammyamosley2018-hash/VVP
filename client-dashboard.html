<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Your Portal — Vibrational Virtue™ Practitioner</title>
<link rel="icon" type="image/png" href="assets/images/vvp-mark-cream.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/vvp-base.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-config.js"></script>
<style>
  .shell { max-width: 620px; margin: 0 auto; padding: 40px 20px 80px; }
  .top-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 26px; flex-wrap: wrap; gap: 12px; }
  .top-row h1 { font-size: 1.7rem; margin: 0; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 26px 28px; }
  .card p { color: var(--ink-mute); }
  .card + .card { margin-top: 18px; }

  .prac-card { display: flex; gap: 16px; }
  .prac-avatar {
    width: 56px; height: 56px; border-radius: 50%; flex: none; background: var(--sand) center/cover no-repeat;
    display: flex; align-items: center; justify-content: center; color: var(--ink-mute); font-weight: 600;
  }
  .prac-name { font-family: 'Fraunces', serif; font-size: 1.1rem; margin: 0; }
  .prac-badge {
    display: inline-block; margin-top: 4px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em;
    background: var(--sand); color: var(--navy); padding: 3px 10px; border-radius: 999px;
  }
  .prac-certs { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .prac-certs li { font-size: 0.8rem; background: var(--parchment); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
  .spinner {
    width: 28px; height: 28px; margin: 60px auto;
    border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="site">
  <img class="mark" src="assets/images/vvp-mark-navy.png" alt="Vibrational Virtue Practitioner crystal mark">
  <div class="word">
    <span class="mark-word">Vibrational Virtue<sup>™</sup> Practitioner</span>
    <span class="subline">Your Portal</span>
  </div>
</header>

<div id="checking" class="spinner"></div>

<div id="shell" class="shell" hidden>
  <div class="top-row">
    <h1 id="greeting">Welcome</h1>
    <button type="button" class="btn-outline" id="sign-out-btn">Sign out</button>
  </div>
  <div class="card">
    <p id="card-text" style="margin-top:0;"></p>
    <a id="results-link" href="client-results.html" class="btn-gold" style="display:none; width:auto; text-decoration:none;">View my results</a>
  </div>

  <div class="card" id="practitioner-card" style="display:none;">
    <div class="prac-card">
      <div class="prac-avatar" id="prac-avatar">?</div>
      <div>
        <p class="prac-name" id="prac-name"></p>
        <span class="prac-badge" id="prac-badge" style="display:none;"></span>
        <ul class="prac-certs" id="prac-certs"></ul>
      </div>
    </div>
  </div>
</div>

<footer class="site">Clarity + Alignment + Harmony + Coherence · Copyright Vibrational Virtue Practitioner 2026</footer>

<script>
(function () {
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const checking = document.getElementById('checking');
  const shell = document.getElementById('shell');
  const greeting = document.getElementById('greeting');
  const cardText = document.getElementById('card-text');
  const resultsLink = document.getElementById('results-link');

  sb.auth.getSession().then(({ data }) => {
    if (!data.session) {
      window.location.href = 'login.html';
      return;
    }

    sb.from('profiles')
      .select('role, full_name')
      .eq('id', data.session.user.id)
      .single()
      .then(({ data: profile, error }) => {
        if (error || !profile) {
          window.location.href = 'login.html';
          return;
        }
        if (profile.role === 'practitioner' || profile.role === 'admin') {
          window.location.href = 'practitioner-dashboard.html';
          return;
        }

        checking.hidden = true;
        shell.hidden = false;
        greeting.textContent = 'Welcome, ' + (profile.full_name || data.session.user.email);

        sb.from('clients')
          .select('id, practitioner_id')
          .eq('user_id', data.session.user.id)
          .then(({ data: clientRows }) => {
            if (clientRows && clientRows.length > 0) {
              cardText.textContent = "Your practitioner shares session results here once they're ready.";
              resultsLink.style.display = 'inline-block';
              loadPractitionerProfile(clientRows[0].practitioner_id);
            } else {
              cardText.textContent = "We don't see any records linked to this account yet. If you've worked with a VVP practitioner using this email, check back soon or reach out to them directly.";
            }
          });
      });
  });

  function initials(name) {
    if (!name) return '?';
    return name.trim().split(/\s+/).slice(0, 2).map(w => w[0].toUpperCase()).join('');
  }

  function loadPractitionerProfile(practitionerId) {
    if (!practitionerId) return;

    sb.from('practitioners').select('full_name, avatar_url, commission_level').eq('id', practitionerId).single()
      .then(({ data: prac }) => {
        if (!prac) return;

        document.getElementById('practitioner-card').style.display = 'block';
        document.getElementById('prac-name').textContent = prac.full_name || 'Your Practitioner';

        const avatarEl = document.getElementById('prac-avatar');
        if (prac.avatar_url) {
          avatarEl.style.backgroundImage = "url('" + prac.avatar_url + "')";
          avatarEl.textContent = '';
        } else {
          avatarEl.textContent = initials(prac.full_name);
        }

        if (prac.commission_level) {
          const badge = document.getElementById('prac-badge');
          badge.textContent = 'VVP ' + prac.commission_level + ' Accredited';
          badge.style.display = 'inline-block';
        }
      });

    sb.from('practitioner_certifications').select('name, level').eq('practitioner_id', practitionerId)
      .then(({ data: certs }) => {
        if (!certs || !certs.length) return;
        document.getElementById('prac-certs').innerHTML = certs.map((c) =>
          '<li>' + c.name + (c.level ? ' — ' + c.level : '') + '</li>'
        ).join('');
      });
  }

  document.getElementById('sign-out-btn').addEventListener('click', () => {
    sb.auth.signOut().then(() => { window.location.href = 'login.html'; });
  });
})();
</script>
</body>
</html>
